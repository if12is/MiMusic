name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MIMUSIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Add GitHub secrets MIMUSIC_KEYSTORE_BASE64, MIMUSIC_KEYSTORE_PASSWORD, MIMUSIC_KEY_ALIAS, and MIMUSIC_KEY_PASSWORD."
            echo "The old keystore was removed from the repository because its password was public."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/mimusic-release.jks

      - name: Build release APK
        env:
          # app/build.gradle.kts resolves this path itself, so it must be absolute.
          # A path like app/keystore/... is looked up inside the app module and signing is skipped.
          MIMUSIC_KEYSTORE_FILE: ${{ github.workspace }}/app/keystore/mimusic-release.jks
          MIMUSIC_KEYSTORE_PASSWORD: ${{ secrets.MIMUSIC_KEYSTORE_PASSWORD }}
          MIMUSIC_KEY_ALIAS: ${{ secrets.MIMUSIC_KEY_ALIAS }}
          MIMUSIC_KEY_PASSWORD: ${{ secrets.MIMUSIC_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="${GITHUB_SHA::7}"
          fi
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No signed release APK. Check MIMUSIC_KEYSTORE_PASSWORD, MIMUSIC_KEY_ALIAS, and MIMUSIC_KEY_PASSWORD."
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          jarsigner -verify "$APK"
          cp "$APK" "dist/MiMusic-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMusic-${{ env.VERSION }}
          path: dist/MiMusic-${{ env.VERSION }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiMusic-${{ env.VERSION }}.apk
          generate_release_notes: true
          name: MiMusic ${{ env.VERSION }}
